services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crud}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-crud}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-crud-api}
      APP_JWT_TTL_SECONDS: ${APP_JWT_TTL_SECONDS:-900}
      APP_LOGIN_MAX_ATTEMPTS: ${APP_LOGIN_MAX_ATTEMPTS:-10}
      APP_LOGIN_WINDOW_SECONDS: ${APP_LOGIN_WINDOW_SECONDS:-60}
      APP_LOGIN_MAX_CLIENTS: ${APP_LOGIN_MAX_CLIENTS:-10000}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    stop_grace_period: 30s

volumes:
  postgres_data:

