spring.datasource.url=jdbc:h2:mem:crud-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# O contexto H2 usa Hibernate; o SQL de produção é validado no PostgreSQL.
spring.flyway.enabled=false

# Isolate test contexts from the local dev profile and bootstrap credentials.
spring.profiles.default=test
app.security.bootstrap.username=
app.security.bootstrap.password=
spring.jpa.show-sql=false

# Exercise the same exposure/detail policy used at runtime.
spring.config.import=classpath:monitoring.properties
