spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crud}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Optional one-time admin creation. No default API credentials.
app.security.bootstrap.username=${APP_ADMIN_USERNAME:}
app.security.bootstrap.password=${APP_ADMIN_PASSWORD:}
springdoc.swagger-ui.csrf.enabled=true
