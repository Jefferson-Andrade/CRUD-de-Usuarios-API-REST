# Common settings. Local execution uses dev unless an explicit profile is selected.
spring.profiles.default=dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.csrf.enabled=true

# Optional one-time admin creation. No default API credentials.
app.security.bootstrap.username=${APP_ADMIN_USERNAME:}
app.security.bootstrap.password=${APP_ADMIN_PASSWORD:}

# Shared monitoring policy, also loaded by test contexts.
spring.config.import=classpath:monitoring.properties

# Explicit opt-in for a dedicated demonstration database. No default credentials.
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.demo.reader.username=${APP_DEMO_READER_USERNAME:}
app.demo.reader.password=${APP_DEMO_READER_PASSWORD:}
app.demo.seed-data=${APP_DEMO_SEED_DATA:false}
